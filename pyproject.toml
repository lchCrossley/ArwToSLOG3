[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arw-to-slog3"
version = "0.1.0"
description = "Develop Sony ARW stills into standard S-Gamut3.Cine / S-Log3 images"
requires-python = ">=3.11"
dependencies = [
  "rawpy>=0.27,<0.28",
  "colour-science>=0.4.7,<0.5",
  "numpy>=2,<3",
  "tifffile>=2025",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
exr = ["OpenEXR>=3.3,<4"]

[project.scripts]
arw-to-slog3 = "arw_to_slog3:main"

[tool.setuptools]
py-modules = ["arw_to_slog3"]
